global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: vllm
    static_configs:
      - targets: ["llm-nemotron:8080"]

  - job_name: llama-embeddings
    static_configs:
      - targets: ["embeddings:8080"]
        labels: { service: embeddings }

  - job_name: llama-reranker
    static_configs:
      - targets: ["reranker:8080"]
        labels: { service: reranker }
