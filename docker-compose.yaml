name: sparkstack

networks:
  sparkstack: {}

volumes:
  dozzle_data: {}
  prometheus_data: {}
  grafana_data: {}

x-gpu: &gpu
  # Every GPU service merges this anchor; dozzle does not. The label feeds
  # dozzle's DOZZLE_FILTER (label=sparkstack), so dozzle hides itself while
  # showing every stack service — this engine's filters have no negation.
  labels: ["sparkstack=true"]
  deploy:
    resources:
      reservations:
        devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

x-llama-service: &llama-service
  build:
    context: .
    target: llama-runtime
    args: { CUDA_ARCH: 121a-real, LLAMA_REF: "${LLAMA_REF:-master}" }
  volumes: ["./models:/models:ro"]
  networks: [sparkstack]
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 300s
  restart: unless-stopped
  <<: *gpu

services:
  llm-coder390:
    profiles: ["llm"]
    # SGLang serves the coder390 NVFP4 W4A16 tier with its bundled DFlash2
    # draft. Model files are local; the cache volume avoids re-running
    # FlashInfer autotune on every start.
    image: lmsysorg/sglang:dev-qwen38-27b-dflash2
    command: >
      python3 -m sglang.launch_server
      --model-path /models/coder390-nvfp4/NVFP4/W4A16
      --speculative-algorithm DFLASH
      --speculative-draft-model-path /models/coder390-nvfp4/NVFP4/W4A16/DFlash2-FP8
      --speculative-num-draft-tokens 8
      --context-length 262144
      --mem-fraction-static 0.72
      --max-running-requests 2
      --reasoning-parser qwen3
      --tool-call-parser qwen3_coder
      --served-model-name coder390
      --api-key "${LLM_API_KEY:?set LLM_API_KEY in .env}"
      --host 0.0.0.0
      --port 8888
      --enable-metrics
      --disable-prefill-cuda-graph
    ports: ["9193:8888"]
    volumes:
      - "./models:/models:ro"
      - "./data/sglang-cache:/root/.cache/sglang"
    networks: [sparkstack]
    ipc: host          # shares the host /dev/shm; shm_size would be ignored
    environment:
      HF_HUB_OFFLINE: "1"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8888/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 900s
    restart: unless-stopped
    <<: *gpu

  d1-decide:
    profiles: ["utility"]
    <<: *llama-service
    command: >
      llama-server
      -m /models/d1-2B/d1-2B-Q8_0.gguf
      --mmproj /models/d1-2B/mmproj-d1-2B-Q8_0.gguf
      --alias d1-2B
      --host 0.0.0.0 --port 8080 -ngl 999 -c 32768 -b 8192 -ub 8192
    ports: ["9194:8080"]

  embeddings:
    profiles: ["utility"]
    <<: *llama-service
    command: >
      llama-server
      -m /models/embeddinggemma-2/embeddinggemma-2-Q8_0.gguf
      --mmproj /models/embeddinggemma-2/mmproj-Q8_0.gguf
      --embedding --pooling mean --metrics
      --host 0.0.0.0 --port 8080 -ngl 999 -c 8192 -b 2048 -ub 2048 --alias embeddinggemma-2
    ports: ["9195:8080"]

  reranker:
    profiles: ["utility"]
    <<: *llama-service
    command: >
      llama-server
      -m /models/reranker/Qwen3-Reranker-0.6B.Q8_0.gguf
      --reranking --pooling rank --embedding --metrics
      --host 0.0.0.0 --port 8080 -ngl 999 -c 8192 --alias qwen3-reranker
    ports: ["9198:8080"]

  image-flux3:
    profiles: ["vision"]
    build:
      context: .
      target: sd-runtime
      args: { CUDA_ARCH: 121a-real, SD_REF: "${SD_REF:-master}" }
    # --strength 0.9: the 0.75 default under-edits when an init image is present.
    # Only used for edits/img2img; text-to-image ignores it.
    # 24 steps: this build's faces and hands are clean at 24; at 8 they are often
    # mangled and the extra texture is grain, not detail (measured at 832x1216).
    # --cfg-scale 1.0: Klein is distilled for guidance 3.5, so CFG is off and
    # negative prompts do not apply. Do not raise this expecting negatives to work.
    # --hires-steps 0: reuse --steps for the hires pass instead of 8.
    # --hires-upscaler RealESRGAN_x4: Real-ESRGAN is installed in
    # models/flux3/upscalers. The built-in latent upscalers repaint and smear faces
    # even at low denoise, so keep a model-backed upscaler as the default.
    # --hires-denoising-strength 0.3: enough to blend the upscale without smearing.
    # --rng/--sampler-rng std_default: pin the sampler RNG explicitly. Pixel-level
    # variation remains because the GPU kernels are not bit-exact.
    command: >
      sd-server
      --listen-ip 0.0.0.0 --listen-port 8080
      --diffusion-model /models/flux3/flux-3-image-klein-Q8_0.gguf
      --llm /models/flux3/Qwen3VL-4B-Instruct-Q8_0.gguf
      --vae /models/flux3/ae.safetensors
      --lora-model-dir /models/flux3/loras
      --hires-upscalers-dir /models/flux3/upscalers
      --steps 24 --cfg-scale 1.0 --strength 0.9
      --hires-steps 0 --hires-upscaler RealESRGAN_x4 --hires-denoising-strength 0.3
      --sampling-method dpm++2m --scheduler karras
      --rng std_default --sampler-rng std_default
      --diffusion-fa --flash-attn on --sage-attn
    ports: ["9196:8080"]
    volumes: ["./models:/models:ro"]
    networks: [sparkstack]
    healthcheck:
      # sd-server serves its embedded web UI at "/" — the only guaranteed-200 route;
      # it has no /health endpoint
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    <<: *gpu

  whisper-x:
    profiles: ["audio"]
    build:
      context: .
      dockerfile: docker/whisperx/Dockerfile
    image: sparkstack-whisperx:3.8.6
    networks: [sparkstack]
    restart: unless-stopped
    ports: ["9191:8003/tcp"]
    environment:
      HF_TOKEN: ${HF_TOKEN:?set HF_TOKEN in .env}
      MODEL_NAME: large-v3
      DIARIZATION_DEVICE: cuda
      DIARIZATION_MODEL: pyannote/speaker-diarization-3.1
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ./data/whisper-data:/root/.cache/huggingface
      - ./data/whisper-data/torch:/root/.cache/torch
    <<: *gpu

  tts-voicedesign:
    image: martinb78/faster-qwen3-tts-dgx-spark:v6.15.0
    profiles: ["audio"]
    networks: [sparkstack]
    restart: unless-stopped
    ports: ["9192:8000"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./models/tts/Qwen3-TTS-VoiceDesign:/models/Qwen3-TTS-VoiceDesign:ro
      - ./config/tts:/config:rw
    # image has no entrypoint, so no bash -c wrapper needed
    command:
      - python3
      - /config/run_voicedesign_server.py
      - --model
      - /models/Qwen3-TTS-VoiceDesign
      - --voices
      - /config/voicedesign_voices.json
      - --port
      - "8000"
      - --max-seq-len
      - "2048"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    <<: *gpu

  status:
    # no shell in the gatus image → no CMD healthcheck; the dashboard's own cards
    # show every service's health, so gatus-health-via-gatus would be circular
    image: twinproduction/gatus:v5.38.0
    profiles: ["status"]
    labels: ["sparkstack=true"]   # visible in dozzle (see x-gpu note)
    networks: [sparkstack]
    ports: ["9190:8080"]
    volumes: ["./config/gatus/config.yaml:/config/config.yaml:ro"]
    restart: unless-stopped

  dozzle:               # live container logs, profile: status
    image: amir20/dozzle:v11.4.3
    profiles: ["status"]
    networks: [sparkstack]
    ports: ["9197:8080"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # read-only; see security note in README
      - dozzle_data:/data                             # settings survive restarts
    environment:
      - DOZZLE_HOSTNAME=SparkStack
      - DOZZLE_FILTER=label=sparkstack   # show stack services only — hides dozzle itself
      - DOZZLE_ENABLE_ACTIONS=true       # start/stop/restart/update from the UI
      - DOZZLE_ENABLE_SHELL=true         # docker exec into containers from the UI; trusted LAN only
      - DOZZLE_ENABLE_MCP=true           # read-only MCP endpoint at http://<host>:9197/api/mcp
      - DOZZLE_NO_ANALYTICS=true         # no outbound telemetry
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  prometheus:
    profiles: ["status"]
    labels: ["sparkstack=true"]
    image: prom/prometheus:v3.16.0
    networks: [sparkstack]
    ports: ["9199:9090"]
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    restart: unless-stopped

  grafana:
    profiles: ["status"]
    labels: ["sparkstack=true"]
    image: grafana/grafana:13.3.1
    networks: [sparkstack]
    ports: ["9200:3000"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-sparkstack}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  node-exporter:
    profiles: ["status"]
    labels: ["sparkstack=true"]
    image: prom/node-exporter:v1.9.1
    networks: [sparkstack]
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ./data/node-exporter/textfile:/var/lib/node-exporter/textfile:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.textfile.directory=/var/lib/node-exporter/textfile
    restart: unless-stopped

  gpu-exporter:
    profiles: ["status"]
    image: nvcr.io/nvidia/cuda:13.0.1-runtime-ubuntu24.04
    networks: [sparkstack]
    volumes:
      - ./scripts/gpu-metrics.sh:/opt/sparkstack/gpu-metrics.sh:ro
      - ./data/node-exporter/textfile:/metrics
    command:
      - /bin/bash
      - -c
      - while true; do /opt/sparkstack/gpu-metrics.sh /metrics/gpu.prom; sleep 15; done
    healthcheck:
      test:
        - CMD-SHELL
        - test $$(( $$(date +%s) - $$(stat -c %Y /metrics/gpu.prom) )) -lt 60
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    <<: *gpu

  tools:
    profiles: ["tools"]
    labels: ["sparkstack=true"]   # visible in dozzle (see x-gpu note)
    build:
      context: .
      target: tools-runtime
      args: { CUDA_ARCH: 121a-real, LLAMA_REF: "${LLAMA_REF:-master}" }
    networks: [sparkstack]
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    volumes: ["./models:/models"]
    entrypoint: ["/bin/sh", "-lc"]
